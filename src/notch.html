<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'"><title>Aurora voice notch</title><link rel="stylesheet" href="pet.css"><link rel="stylesheet" href="notch.css"></head><body><section id="notch" data-expanded="false"><div id="pet-host" class="pet-host" data-state="idle"></div><div class="content"><header><span class="name">Aurora <span>♥ heartflow</span></span><div class="controls"><button id="open" title="Open Aurora" aria-label="Open Aurora">↗</button><button id="finish" title="Finish recording and send" aria-label="Finish recording and send" hidden>✓</button><button id="stop" title="Stop task" aria-label="Stop task">■</button><button id="mic" title="Turn microphone off" aria-label="Turn microphone off">◉</button></div></header><div class="status"><span id="dot"></span><span id="status">Microphone off</span><span class="wave" aria-hidden="true">▂ ▅ ▃ ▆ ▂</span></div><div class="conversation"><div id="reply" class="reply" aria-live="polite"></div><div id="choices" class="choices" hidden></div><div id="heard" class="heard"></div><pre id="proposal" hidden></pre><div id="approval-buttons" hidden><button id="deny">Deny action</button><button id="approve">Approve once</button></div><div id="error" role="alert"></div></div><footer id="hint">Say “Aurora” to wake me</footer></div></section><script src="pet-art.js"></script><script src="notch.js"></script></body></html>
